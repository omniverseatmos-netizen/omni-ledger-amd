name: AtMoS Pilot verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atmos
          POSTGRES_PASSWORD: atmos-ci-password
          POSTGRES_DB: atmos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U atmos -d atmos_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Apply PostgreSQL schema
        env:
          PGPASSWORD: atmos-ci-password
          DATABASE_URL: postgresql://atmos:atmos-ci-password@127.0.0.1:5432/atmos_test
        run: |
          set -o pipefail
          npm run db:migrate 2>&1 | tee migration.log
      - name: Run release verification
        run: npm run verify:release
      - name: Run real PostgreSQL integration tests
        env:
          ATMOS_POSTGRES_INTEGRATION: '1'
          DATABASE_URL: postgresql://atmos:atmos-ci-password@127.0.0.1:5432/atmos_test
        run: npm run test:postgres
      - name: Verify normalized parity
        env:
          DATABASE_URL: postgresql://atmos:atmos-ci-password@127.0.0.1:5432/atmos_test
        run: npm run db:parity | tee normalized-parity.json
      - name: Create disposable restore database
        env:
          PGPASSWORD: atmos-ci-password
        run: createdb -h 127.0.0.1 -U atmos atmos_restore
      - name: Run backup and restore drill
        env:
          DATABASE_URL: postgresql://atmos:atmos-ci-password@127.0.0.1:5432/atmos_test
          RESTORE_DATABASE_URL: postgresql://atmos:atmos-ci-password@127.0.0.1:5432/atmos_restore
          EXPECTED_RPO_SECONDS: '0'
        run: npm run db:backup-drill | tee backup-restore-drill.json

      - name: Upload database verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atmos-database-verification
          path: |
            migration.log
            normalized-parity.json
            backup-restore-drill.json
          if-no-files-found: ignore
